name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ------- Gate: ban type ignore -------
  ban-suppressions:
    name: Ban type ignore suppressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for type ignore comments
        run: |
          if grep -rn '# type: ignore\|// @ts-ignore' --include='*.ts' --include='*.tsx' --include='*.js' .; then
            echo "❌ Type ignore suppressions found above."
            exit 1
          fi
          echo "✅ No type suppressions found."

  # ------- Format (Prettier) -------
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx prettier --check .

  # ------- Lint (ESLint) -------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx eslint . --max-warnings 0

  # ------- Type Check (TypeScript) -------
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  # ------- Test (Vitest) -------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run --reporter=verbose

  # ------- E2E (separate job) -------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run --config vitest.e2e.config.ts --reporter=verbose
